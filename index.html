<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despachante · Sistema de Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/base.css">

</head>

<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="logo-circle">
        <img class="brand-logo" alt="Logo Despachante Claudio Luz" width="44" height="44">
      </div>
      <h2>Acesso ao sistema</h2>
      <p>Entre com seu usuário e senha para continuar.</p>
      <div id="loginError" class="login-error" style="display:none;">Usuário ou senha incorretos.</div>
      <div class="field">
        <label>Usuário</label>
        <input id="loginUser" placeholder="Usuário" autocomplete="username"
          onkeydown="if(event.key==='Enter') document.getElementById('loginPass').focus();">
      </div>
      <div class="field">
        <label>Senha</label>
        <input id="loginPass" type="password" placeholder="Senha" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') attemptLogin();">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;"
        onclick="attemptLogin()">Entrar</button>
    </div>
  </div>
  <div id="app" style="display:none;">
    <div class="sidebar">
      <div class="brand">
        <div class="logo-circle">
          <img class="brand-logo" alt="Logo Despachante Claudio Luz" width="44" height="44">
          <div id="brandFallback"
            style="display:none;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#251506;font-family:'Oswald';font-weight:700;font-size:13px;align-items:center;justify-content:center;">
            DC</div>
        </div>
        <div class="brand-text"><b>DESPACHANTE</b><span>Gestão de Processos</span></div>
      </div>
      <div class="nav">
        <button class="nav-item" data-view="home" onclick="go('home')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
          <span>Início</span>
        </button>
        <button class="nav-item" data-view="clientes" onclick="go('clientes')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Clientes</span>
        </button>
        <button class="nav-item" data-view="agenda" onclick="go('agenda')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          <span>Agenda</span>
        </button>
        <button class="nav-item" data-view="relatorio" onclick="go('relatorio')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 20V10M12 20V4M6 20v-6" />
          </svg>
          <span>Financeiro</span>
        </button>
        <div class="nav-divider"></div>
        <button class="nav-item" onclick="openClientForm()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>Novo cliente</span>
        </button>
      </div>
      <div class="nav-divider"></div>
      <button class="nav-item" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
          <path d="M16 17l5-5-5-5" />
          <path d="M21 12H9" />
        </svg>
        <span>Sair</span>
      </button>
      <div class="sidebar-foot">Sistema de Gestão<br>© 2026</div>
    </div>
    <div class="main" id="mainEl">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <div>Carregando dados do escritório…</div>
      </div>
    </div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>

</html>
